services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrimitra
      POSTGRES_USER: agrimitra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrimitra_dev_password}
    ports: ['5432:5432']
    volumes: [agrimitra_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U agrimitra -d agrimitra']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [agrimitra_redis:/data]
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agrimitra_postgres:
  agrimitra_redis:
